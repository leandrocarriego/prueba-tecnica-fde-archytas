# Plataforma Cordillera — one Compose file, two modes.
#
#   docker compose up -d                 -> Postgres + RabbitMQ (or `make dev`)
#       The day-to-day mode: database and queue in containers, backend and
#       frontend running natively on the host. That is what gives hot reload
#       and a debugger that actually attaches.
#
#   docker compose --profile full up -d  -> everything in containers (`make full`)
#       The whole stack on this machine, ports published on loopback. It needs
#       no reverse proxy: it is how you check the production images locally.
#
#   docker compose --profile deploy up -d -> the VPS (`make deploy`)
#       Same services, but the frontend joins the shared `traefik` network and
#       carries the routers that publish the domain. Nothing else is reachable
#       from outside: the browser talks to Next, and only Next talks to the API.
#
#   --profile tools                      -> adds Flower (queue inspection)
#
# There is deliberately no middle mode ("the app in containers, with hot
# reload"): Compose cannot make `volumes` or a build `target` conditional on a
# variable, so keeping it meant duplicating every service — the same drift that
# having two Compose files caused, moved inside one. To develop, run natively.

x-backend-build: &backend-build
  build:
    context: ./backend
    dockerfile: Dockerfile

# `next.config.js` publishes NEXT_PUBLIC_API_URL through `env`, and Next inlines
# that into the bundle AT BUILD TIME. Passing it only as a runtime variable
# leaves the built image pointing wherever it was built, so it travels as a
# build argument as well.
#
# `backend` is Docker's DNS name on `cordillera_network`, and it is right in
# both modes: every caller of this variable runs on the server side of Next
# (the proxy route, `createServerClient`, `lib/health.ts`). Nothing in the
# browser ever reads it — which is why the API needs no public route.
x-frontend-build: &frontend-build
  build:
    context: ./frontend
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_API_URL: http://backend:8000
  image: cordillera-frontend:latest

x-frontend-env: &frontend-env
  NODE_ENV: production
  NEXT_PUBLIC_API_URL: http://backend:8000

x-backend-env: &backend-env
  # The `full` profile is the production stack, so production is the default.
  # Set ENVIRONMENT=development to bring it up in development mode.
  ENVIRONMENT: ${ENVIRONMENT:-production}
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-cordillera}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cordillera}
  POSTGRES_DB: ${POSTGRES_DB:-cordillera}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-admin}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672//
  CELERY_RESULT_BACKEND: rpc://
  # SIGProv portal (read-only). Credentials come from the environment and are
  # never baked into an image (Artículo VII).
  PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://prueba-tecnica-portal.vercel.app}
  PORTAL_USER: ${PORTAL_USER:-}
  PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
  PORTAL_HEADLESS: ${PORTAL_HEADLESS:-true}
  PORTAL_DOWNLOAD_TTL_SECONDS: ${PORTAL_DOWNLOAD_TTL_SECONDS:-45}
  PORTAL_NAVIGATION_TIMEOUT_MS: ${PORTAL_NAVIGATION_TIMEOUT_MS:-15000}
  PORTAL_HISTORY_SPACING_SECONDS: ${PORTAL_HISTORY_SPACING_SECONDS:-20}
  # Where the links inside a message point. Unlike the API's own address this
  # one cannot be hard-coded: it is the public domain on the server and
  # localhost on a laptop, and an invitation pointing at localhost is an
  # invitation nobody can open.
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  # WhatsApp, through Evolution API. Empty means the channel is off and every
  # message is only written to the log — which is a platform where nobody can
  # be invited and therefore nobody can log in. On a server these are set.
  # `evolution_api` is a service of this same file, so the address is not a
  # setting anybody has to know: it is Docker's DNS name on `cordillera_network`.
  EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution_api:8080}
  # One key, two readers: the gateway authenticates callers with it and the
  # backend calls with it. Two variables for one secret is how they drift.
  EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
  EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-cordillera}
  EVOLUTION_TIMEOUT_SECONDS: ${EVOLUTION_TIMEOUT_SECONDS:-15}
  NOTIFICATIONS_WHATSAPP_TO: ${NOTIFICATIONS_WHATSAPP_TO:-}
  NOTIFICATIONS_TO_DISK: ${NOTIFICATIONS_TO_DISK:-false}
  NOTIFICATIONS_OUTBOX_DIR: ${NOTIFICATIONS_OUTBOX_DIR:-./outbox}
  # The first access. It is created by the bootstrap command and by nothing
  # else, so without these the installed platform has no owner to hand it to.
  OWNER_EMAIL: ${OWNER_EMAIL:-}
  OWNER_NAME: ${OWNER_NAME:-}
  OWNER_PHONE: ${OWNER_PHONE:-}

x-app-defaults: &app-defaults
  restart: ${RESTART_POLICY:-unless-stopped}
  networks: [cordillera_network]

x-depends-on-infra: &depends-on-infra
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # ── Infrastructure · always on ────────────────────────────────────────────
  # Ports are published on 127.0.0.1, not 0.0.0.0: locally that is all the
  # native backend needs, and in production it stops the database from being
  # exposed to the world by omission. BIND_HOST opens it for whoever needs it.
  postgres:
    image: postgres:17-alpine
    container_name: cordillera_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cordillera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cordillera}
      POSTGRES_DB: ${POSTGRES_DB:-cordillera}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cordillera} -d ${POSTGRES_DB:-cordillera}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    <<: *app-defaults

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cordillera_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${BIND_HOST:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${BIND_HOST:-127.0.0.1}:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    <<: *app-defaults

  # ── Application · profile `full` ──────────────────────────────────────────
  # PENDING (Playwright): backend/Dockerfile starts from python:3.14-slim and
  # does not install the browsers. Extraction runs in celery_worker, so the
  # image MUST carry chromium and its system libraries before the first deploy:
  # `playwright install --with-deps chromium` in the Dockerfile. Until then,
  # extraction runs from the host (`make playwright-install`).
  backend:
    <<: [*backend-build, *app-defaults]
    container_name: cordillera_backend
    profiles: ["full", "deploy"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2}
    environment: *backend-env
    ports:
      - "${BIND_HOST:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on: *depends-on-infra
    mem_limit: 768m
    # No Traefik router, deliberately. The API is not published: the browser
    # talks to Next, and Next talks to the API over `cordillera_network`. That
    # is what `app/api/proxy/[...path]` is for — it also attaches the session
    # token, which a reverse proxy could not read out of an httpOnly cookie.

  celery_worker:
    <<: [*backend-build, *app-defaults]
    container_name: cordillera_celery_worker
    profiles: ["full", "deploy"]
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1}
    environment: *backend-env
    depends_on: *depends-on-infra
    mem_limit: 384m

  celery_beat:
    <<: [*backend-build, *app-defaults]
    container_name: cordillera_celery_beat
    profiles: ["full", "deploy"]
    command: celery -A app.worker.celery_app:celery_app beat --loglevel=info
    environment: *backend-env
    depends_on: *depends-on-infra
    mem_limit: 256m

  # ── WhatsApp · the way out to a person ────────────────────────────────────
  # Everything the platform has to tell somebody goes by WhatsApp — the
  # invitation, the recovery link, the alert when the update stops working —
  # and this is what puts it on the wire. It is a third party's software
  # holding somebody's WhatsApp session, so two decisions are load-bearing:
  #
  # **It is never published.** No Traefik router, and the port is bound to
  # loopback. Whoever needs the QR reaches it through the SSH tunnel that
  # already gets them to the server. Publishing it would put a WhatsApp account
  # that is not ours on the open internet.
  #
  # **It does not keep the conversations.** Only the instance is persisted,
  # which is what lets the session survive a restart. Messages, contacts, chats
  # and history are off: they belong to whoever is talking, not to us.
  #
  # No `CONFIG_SESSION_PHONE_VERSION`, on purpose. It pins the WhatsApp Web
  # version the socket presents as; v2.2.3 carried one hardcoded and expired,
  # and WhatsApp answered by closing the socket — Baileys then retried every
  # two seconds, emitting no QR and no error. v2.3.7 resolves it on its own and
  # was checked to emit a QR without the pin, so pinning it here would be
  # planting tomorrow's version of the same failure. If it ever stops
  # connecting and the log repeats "Baileys version env" every two seconds,
  # that is the symptom: read the number Baileys publishes and pin it while it
  # lasts.
  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: cordillera_evolution
    profiles: ["full", "deploy"]
    restart: ${RESTART_POLICY:-unless-stopped}
    networks: [cordillera_network]
    depends_on:
      evolution_postgres:
        condition: service_healthy
      evolution_redis:
        condition: service_started
    ports:
      # Loopback only: this is how the SSH tunnel reaches the pairing QR.
      - "${BIND_HOST:-127.0.0.1}:8080:8080"
    environment:
      SERVER_URL: http://evolution_api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      QRCODE_LIMIT: "10"
      CONFIG_SESSION_PHONE_CLIENT: Cordillera
      CONFIG_SESSION_PHONE_NAME: Chrome
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD:-evolution}@evolution_postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution_redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    mem_limit: 768m

  # Its own database, and not a second schema in ours. `raw`, `staging`, `core`
  # and `operations` are the pipeline (Artículo III); a third party's tables
  # living beside them would blur what that database is for, and its migrations
  # would run against the one thing this product cannot afford to lose.
  evolution_postgres:
    image: postgres:17-alpine
    container_name: cordillera_evolution_postgres
    profiles: ["full", "deploy"]
    restart: ${RESTART_POLICY:-unless-stopped}
    networks: [cordillera_network]
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:-evolution}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  # Not RabbitMQ: this is the gateway's own cache, on its own terms, and the
  # queue our tasks run on has nothing to do with it.
  evolution_redis:
    image: redis:7-alpine
    container_name: cordillera_evolution_redis
    profiles: ["full", "deploy"]
    restart: ${RESTART_POLICY:-unless-stopped}
    networks: [cordillera_network]
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    mem_limit: 128m

  # Two frontends, one image, never both at once. They differ in how they are
  # reached, and in nothing else: locally through a published port, on the VPS
  # through Traefik. Keeping them apart is what lets `full` run on a laptop
  # where the shared `traefik` network does not exist.
  frontend:
    <<: [*frontend-build, *app-defaults]
    profiles: ["full"]
    environment: *frontend-env
    ports:
      - "${BIND_HOST:-127.0.0.1}:3000:3000"
    depends_on:
      - backend
    mem_limit: 384m

  # ── The VPS · profile `deploy` ────────────────────────────────────────────
  # The only service the outside world reaches. Traefik terminates TLS and
  # routes by these labels; it takes the certificate through the Cloudflare DNS
  # challenge, so the record can stay proxied and nothing has to answer on :80.
  frontend_deploy:
    <<: [*frontend-build, *app-defaults]
    container_name: cordillera_frontend
    profiles: ["deploy"]
    environment: *frontend-env
    depends_on:
      - backend
    mem_limit: 384m
    # On two networks, so Traefik has to be told which one to dial.
    networks: [cordillera_network, traefik]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.cordillera.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.cordillera.entrypoints=websecure"
      - "traefik.http.routers.cordillera.tls=true"
      - "traefik.http.routers.cordillera.tls.certresolver=cloudflare"
      - "traefik.http.services.cordillera.loadbalancer.server.port=3000"

  # ── Optional observability · profile `tools` ──────────────────────────────
  # Flower watches extraction tasks in flight. It is not needed day to day,
  # which is why it stays out of the default start-up.
  celery_flower:
    <<: [*backend-build, *app-defaults]
    container_name: cordillera_celery_flower
    profiles: ["tools"]
    command: celery -A app.worker.celery_app:celery_app flower --port=5555
    ports:
      - "${BIND_HOST:-127.0.0.1}:5555:5555"
    environment:
      # The minimum app.config.Settings demands, without the portal
      # credentials: Flower only looks at the queue.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-cordillera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cordillera}
      POSTGRES_DB: ${POSTGRES_DB:-cordillera}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: rpc://
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    depends_on:
      rabbitmq:
        condition: service_healthy
    mem_limit: 256m
    # No router either: this is the queue's console. It is reached over the SSH
    # tunnel that already gets you to the server, not published on a domain.

volumes:
  postgres_data:
  rabbitmq_data:
  # The paired WhatsApp session. Losing these means pairing the phone again.
  evolution_instances:
  evolution_pgdata:
  evolution_redis:

networks:
  cordillera_network:
    driver: bridge
  # Created once on the host, shared by every project the reverse proxy serves.
  # Only the `deploy` profile joins it, so `full` needs nothing on a laptop.
  traefik:
    external: true
