# Alembic configuration for the Cordillera platform.
#
# The database URL is NOT set here. `alembic/env.py` reads it from
# `app.config.settings.database_url`, so there is a single source of truth and no
# credentials in the repository.

[alembic]
# Path to the migration scripts, relative to this file.
script_location = alembic

# Prepended to sys.path so `app` is importable from env.py.
prepend_sys_path = .

# Revision file names: `<rev>_<slug>.py` (e.g. 0001_initial.py).
file_template = %%(rev)s_%%(slug)s

# Timezone used when rendering the creation date inside a revision.
# Left unset (local time) on purpose: setting it requires the `alembic[tz]`
# extra to be present in every image that generates revisions.
# timezone =

# Max length of the "slug" part of a revision file name.
truncate_slug_length = 40

# Separator used to split `version_locations`.
version_path_separator = os

# Placeholder only. env.py overrides it with the application settings; leaving it
# empty keeps Alembic from silently connecting somewhere unintended.
sqlalchemy.url =


[post_write_hooks]
# Format and lint freshly generated revisions with Ruff (the project's single
# formatter/linter). Requires the dev dependency group to be installed.
hooks = ruff_format, ruff_check

ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_check.type = console_scripts
ruff_check.entrypoint = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
