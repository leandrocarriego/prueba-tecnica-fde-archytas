# What used to depend on someone remembering to run the commands by hand.
#
# Pre-commit covers the fast checks (format, types, unit and architecture
# tests). This runs what cannot run inside a commit: the full suite against a
# real database, the coverage gate, and the check that models and tables still
# describe the same thing.
#
# Without this, CONSTITUTION.md promises "a test that breaks the build" while
# there is no build to break.
#
# Step names are in Spanish on purpose: they are what the team reads in the
# Actions UI. Comments are in English, like the rest of the configuration.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: cordillera
  POSTGRES_PASSWORD: cordillera
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  SECRET_KEY: ci-secret-key

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cordillera
          POSTGRES_PASSWORD: cordillera
          # The suite forces POSTGRES_DB=cordillera_test and refuses to run
          # against a database whose name does not end in `_test`.
          POSTGRES_DB: cordillera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cordillera"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # El OCR de las facturas escaneadas necesita el binario y sus paquetes de
      # idioma. Sin ellos `pytesseract` no explota: devuelve texto vacío, y el
      # único test que lo cubre falla acá y sólo acá, porque en una laptop con
      # Homebrew está instalado. Los mismos tres paquetes van en
      # `backend/Dockerfile`, por la misma razón.
      - name: Instalar tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        working-directory: backend
        run: uv sync --locked

      # DEP-02: the lockfile travels with pyproject.toml. `--locked` above
      # already fails when they drift; this note says why that matters.
      - name: Formato y lint (PY-08)
        working-directory: backend
        run: |
          uv run ruff format --check app tests
          uv run ruff check app tests

      - name: Tipos (PY-10)
        working-directory: backend
        run: uv run mypy app

      # Runs the whole suite: unit, integration, e2e and architecture.
      # The coverage gate (TEST-05) lives in pyproject's addopts.
      - name: Tests y cobertura
        working-directory: backend
        run: uv run pytest --junitxml=.pytest-report.xml

      # The status page shows the test count and the coverage. This is what
      # keeps those two numbers from drifting into a lie: the committed
      # snapshot has to match the run that just happened, so a stale one fails
      # the build instead of reaching the page.
      - name: La foto de calidad sigue siendo verdad
        working-directory: backend
        run: uv run python ../scripts/quality_snapshot.py --check

      # Pre-commit checks this too, but a hook is skipped by --no-verify and a
      # command that fails to register does so in silence.
      - name: Frontmatter de los comandos
        run: uv run --quiet --with pyyaml python scripts/validate_command_frontmatter.py

      # DB-01: models and tables describe the same thing.
      #
      # On a database of its own, raised by the migration chain — not on the
      # suite's. The suite builds its schema from `Base.metadata` on purpose,
      # so it never stamps a revision and `check` would only ever find it out
      # of date. Migrating first is also the stronger question: it asks whether
      # the migrations produce the models, which is what DB-01 promises.
      - name: Migraciones sincronizadas (DB-01)
        working-directory: backend
        env:
          POSTGRES_DB: cordillera_migrations
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" \
            -U "$POSTGRES_USER" -d postgres -c 'CREATE DATABASE cordillera_migrations'
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint y formato (TS-06)
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check

      - name: Tipos (TS-01)
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build

  diagrams:
    name: Diagramas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # This is what makes "a broken diagram breaks the build" true in
      # docs/specs/DIAGRAMS.md.
      - name: Validar los .mmd
        run: make diagrams-check
